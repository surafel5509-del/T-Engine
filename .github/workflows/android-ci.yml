name: Build T-Engine Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test Engine & Build Debug/Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          chmod +x gradlew
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run T-Engine Core & Android Unit Tests
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew :tengine-core:test testDebugUnitTest --stacktrace 2>&1 | tee test-build.log; then
            details=$(grep -E '^e: |FAILURE:|Caused by:|What went wrong:|^\* |> |FAILED' test-build.log | tail -n 35 | tr '\n' ' ; ')
            echo "::error title=Unit Test / Compile Failure::${details}"
            exit 1
          fi

      - name: Upload Engine Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: T-Engine-Test-Reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Prepare Release Signing Keystore
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/tengine-release.p12"
          keytool -genkeypair -v \
            -keystore "${KEYSTORE_FILE}" \
            -storetype PKCS12 \
            -alias tengine \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tengine123 \
            -keypass tengine123 \
            -dname "CN=T-Engine 2D, OU=GameEngine, O=TEngine, L=AddisAbaba, C=ET"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=tengine123" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=tengine" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=tengine123" >> "${GITHUB_ENV}"

      - name: Build Debug & Signed Release APKs
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee apk-build.log; then
            details=$(grep -E '^e: |FAILURE:|Caused by:|What went wrong:|^\* |> ' apk-build.log | tail -n 35 | tr '\n' ' ; ')
            echo "::error title=APK Build Failure::${details}"
            exit 1
          fi

      - name: Stage & Verify Built APKs
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/T-Engine-2D-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apks/T-Engine-2D-Release-Signed.apk
          cd dist-apks
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh *.apk

          debug_sz=$(du -h T-Engine-2D-Debug.apk | cut -f1)
          rel_sz=$(du -h T-Engine-2D-Release-Signed.apk | cut -f1)
          echo "::notice title=APKs Built Successfully::T-Engine-2D-Debug.apk (${debug_sz}), T-Engine-2D-Release-Signed.apk (${rel_sz})"

          {
            echo "## T-Engine 2D Android APK Build Summary"
            echo ""
            echo "| Artifact | File | Size | SHA-256 |"
            echo "| :--- | :--- | :--- | :--- |"
            for f in *.apk; do
              sz=$(du -h "$f" | cut -f1)
              sh=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| Android APK | \`$f\` | **$sz** | \`$sh\` |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload T-Engine Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: T-Engine-2D-Debug-APK
          path: dist-apks/T-Engine-2D-Debug.apk
          retention-days: 30

      - name: Upload T-Engine Signed Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: T-Engine-2D-Release-APK
          path: |
            dist-apks/T-Engine-2D-Release-Signed.apk
            dist-apks/SHA256SUMS.txt
          retention-days: 30

      - name: Publish APKs to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist-apks/T-Engine-2D-Debug.apk \
            dist-apks/T-Engine-2D-Release-Signed.apk \
            dist-apks/SHA256SUMS.txt \
            --generate-notes \
            --title "T-Engine 2D ${GITHUB_REF_NAME}" || \
          gh release upload "${GITHUB_REF_NAME}" \
            dist-apks/T-Engine-2D-Debug.apk \
            dist-apks/T-Engine-2D-Release-Signed.apk \
            dist-apks/SHA256SUMS.txt --clobber
